name: bonsai

on:
  schedule:
    - cron: '0 8 * * *'   # una vez al día
  workflow_dispatch:       # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write          # necesario para hacer commit de las imágenes generadas

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fijado al commit al que apunta la etiqueta v1 (revisado: solo llama a la API GraphQL
      # de GitHub y sube 4 imágenes a output/)
      - uses: egorthinks/git-bonsai@665258cab3f304cfb33a96fc7bf108cec1f452f3 # v1
